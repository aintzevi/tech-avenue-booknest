<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Tech Avenue BookNest</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Georgia, serif;
            color: #333;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .cart-container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #764ba2;
            text-align: center;
            border-bottom: 2px dashed #667eea;
            padding-bottom: 15px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px dotted #ccc;
            margin: 10px 0;
        }
        .item-name {
            font-weight: bold;
            color: #333;
        }
        .item-price {
            color: #667eea;
            font-size: 16px;
        }
        .total {
            text-align: right;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #764ba2;
        }
        .checkout-btn {
            background-color: white;
            color: #764ba2;
            border: 2px solid #764ba2;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
        }
        .checkout-btn:hover {
            background-color: #764ba2;
            color: white;
        }
    </style>
</head>
<body>
    <div class="cart-container">
        <h1>Your Shopping Cart</h1>
        {% for item in cart_items %}
        <div class="cart-item">
             <span class="item-name">{{ item.title }}</span>
            <span class="item-price">$12.99</span>
        </div>
        {% endfor %}
        <div class="cart-item">
            <span class="item-name">Shipping (flat)</span>
            <span class="item-price">{{ shipping or "$9.90" }}</span>
        </div>
        <div class="total">
            Total: {{ total or "$65.49" }}
        </div>
        <div style="margin-top: 10px; font-size: 11px; color: #999;">
            Last cart update by: {{ last_user or "unknown" }}
        </div>
        <button class="checkout-btn">Proceed to Checkout</button>
    </div>
</body>
</html>
